[project]
name = "docs-assistant"
version = "0.1.0"
description = "Internal engineering docs assistant — running example for the Agents, RAG fundamentals & Advanced Retrieval lecture"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docs_assistant*"]
